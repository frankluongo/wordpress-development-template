# Throwaway stack used by `npm run release` / `npm run zip` to check that a release zip
# installs and activates on a clean WordPress (R8.7). No bind mounts, no proxy, no ports.
# Started as `docker compose -p <project>-verify -f compose.verify.yaml` and removed with -v.

services:
  php:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WP_CLI_VERSION: ${WP_CLI_VERSION:-2.12.0}
    image: ${COMPOSE_PROJECT_NAME}-php:${PHP_VERSION:-8.3}
    depends_on:
      db:
        condition: service_healthy
    environment:
      SITE_DOMAIN: verify.invalid
      SITE_TITLE: Release verification
      WP_VERSION: ${WP_VERSION:-latest}
      DB_HOST: db
      DB_NAME: wordpress
      DB_USER: wordpress
      DB_PASSWORD: wordpress
      TABLE_PREFIX: wp_
      LOCAL_ADMIN_PASSWORD: verify
      XDEBUG_MODE: "off"
      PHP_UPLOAD_MAX: 64M
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_EXECUTION_TIME: "60"
    volumes:
      - wordpress:/var/www/html
      - ./docker/wordpress/wp-config.php:/var/www/html/wp-config.php:ro
      - ./dist:/dist:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/wp-dev-ready"]
      interval: 2s
      timeout: 2s
      retries: 300
      start_period: 10m

  db:
    image: ${DB_IMAGE:-mariadb}:${DB_VERSION:-10.11}
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - (command -v mariadb-admin >/dev/null && mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent) || mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  wordpress:
