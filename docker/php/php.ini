; Limits for large client sites (R2.11). Values come from .env.
upload_max_filesize = ${PHP_UPLOAD_MAX}
post_max_size = ${PHP_UPLOAD_MAX}
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_time = ${PHP_MAX_EXECUTION_TIME}
max_input_vars = 5000

; Errors go to WordPress's debug.log via WP_DEBUG_LOG; keep them off the page.
display_errors = Off
log_errors = On
error_reporting = E_ALL

; Revalidate on every request so edits to bind-mounted PHP show immediately.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
